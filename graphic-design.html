<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseño Gráfico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/title.css">
    <link rel="stylesheet" href="styles/graphic-design.css">
</head>
<body>
    <header>
        <div class="title-container" style="max-width: 1200px; margin: 0 auto;">
            <div class="titletxt-container" style="width: 100%; text-align: center;">
                <h1 class="page-title">Diseño Gráfico</h1>
                <p class="page-subtitle">Banners, carteles, ilustraciones y maquetación — todos mis trabajos de diseño</p>
            </div>
        </div>
    </header>

    <main>
        <!-- TOP BACK BUTTON -->
        <div class="back-container top-back">
            <a href="index.html" class="back-btn">Volver al inicio</a>
        </div>

        <!-- BANNERS (Photoshop) -->
        <div class="section-divider">
            <h2>Banners</h2>
        </div>
        <section class="grid-container-photoshop">
            <img class="banner" src="assets/pics/banner-grefu.jpg" alt="Grefu">
            <img class="banner" src="assets/pics/banner-chab.png" alt="Chab">
            <img class="banner" src="assets/pics/banner-semorka.png" alt="Semorka">
            <img class="cartel" src="assets/pics/cartel-cd-lol.jpg" alt="Cartel CD LOL">
            <img class="cartel" src="assets/pics/cartel-jinx.jpg" alt="Cartel Jinx">
        </section>

        <!-- CARTELES (Illustrator) -->
        <div class="section-divider">
            <h2>Carteles</h2>
        </div>
        <section class="grid-container-illustrator">
            <img class="item logo" src="assets/pics/logo.png" alt="Logo">
            <img class="item personaje-text" src="assets/pics/personaje-text.jpg" alt="Personaje Text">
            <img class="item motivo-hp" src="assets/pics/motivo-hp.jpg" alt="Motivo HP">
            <img class="item skull" src="assets/pics/skull.jpg" alt="Skull">
        </section>

        <!-- MAQUETACIÓN (PDFs) -->
        <div class="section-divider">
            <h2>Maquetación</h2>
        </div>
        <section class="pdf-showcase">
            <div class="pdf-item">
                <div class="pdf-wrapper">
                    <iframe src="assets/identidad-corporativa.pdf" title="Manual de identidad corporativa"></iframe>
                    <div class="pdf-overlay">
                        <a href="assets/identidad-corporativa.pdf" target="_blank" class="pdf-action">Abrir en nueva pestaña</a>
                        <a href="assets/identidad-corporativa.pdf" download class="pdf-action pdf-download">Descargar</a>
                    </div>
                </div>
                <p class="pdf-caption">Manual de identidad corporativa</p>
            </div>
            <div class="pdf-item">
                <div class="pdf-wrapper">
                    <iframe src="assets/catalogo.pdf" title="Catálogo"></iframe>
                    <div class="pdf-overlay">
                        <a href="assets/catalogo.pdf" target="_blank" class="pdf-action">Abrir en nueva pestaña</a>
                        <a href="assets/catalogo.pdf" download class="pdf-action pdf-download">Descargar</a>
                    </div>
                </div>
                <p class="pdf-caption">Catálogo</p>
            </div>
        </section>

        <!-- BACK BUTTON -->
        <div class="back-container">
            <a href="index.html" class="back-btn">Volver al inicio</a>
        </div>
    </main>
</body>
</html>
