<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Pablo Jurado Soto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/title.css">
    <style>
        /* === PAGE TITLE === */
        .page-title {
            text-align: center;
            color: #ffffff;
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 800;
            margin: 2rem 0 0.5rem;
            background: linear-gradient(135deg, #ffffff 0%, #63b7e7 50%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInUp 0.8s ease-out;
        }

        .page-subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.1rem;
            max-width: 700px;
            margin: 0 auto 3rem;
            animation: fadeInUp 0.8s ease-out 0.1s both;
        }

        /* === PDF CONTAINER === */
        .pdf-container {
            display: flex;
            justify-content: center;
            padding: 0 1rem;
            margin-bottom: 3rem;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .pdf-container iframe {
            width: min(90%, 800px);
            height: 1100px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.02);
            transition: all 0.3s ease;
        }

        .pdf-container iframe:hover {
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4), 0 0 30px rgba(99, 183, 231, 0.08);
            border-color: rgba(99, 183, 231, 0.15);
            transform: translateY(-4px);
        }

        /* === DOWNLOAD BUTTON === */
        .actions-container {
            text-align: center;
            margin: 2rem 0 3rem;
            animation: fadeInUp 0.8s ease-out 0.25s both;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 2rem;
            background: linear-gradient(135deg, rgba(99, 183, 231, 0.15), rgba(168, 85, 247, 0.15));
            border: 1px solid rgba(99, 183, 231, 0.2);
            text-decoration: none;
            border-radius: 12px;
            color: #63b7e7;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            margin: 0 0.5rem;
        }

        .download-btn:hover {
            background: linear-gradient(135deg, rgba(99, 183, 231, 0.25), rgba(168, 85, 247, 0.25));
            border-color: #63b7e7;
            box-shadow: 0 4px 20px rgba(99, 183, 231, 0.2);
            transform: translateY(-2px);
        }

        /* === BACK BUTTON === */
        .back-container {
            text-align: center;
            margin: 2rem 0 4rem;
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 2rem;
            background: linear-gradient(135deg, rgba(99, 183, 231, 0.15), rgba(168, 85, 247, 0.15));
            border: 1px solid rgba(99, 183, 231, 0.2);
            text-decoration: none;
            border-radius: 12px;
            color: #63b7e7;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .back-btn::before {
            content: '←';
            transition: transform 0.3s ease;
        }

        .back-btn:hover {
            background: linear-gradient(135deg, rgba(99, 183, 231, 0.25), rgba(168, 85, 247, 0.25));
            border-color: #63b7e7;
            box-shadow: 0 4px 20px rgba(99, 183, 231, 0.2);
            transform: translateX(-4px);
        }

        .back-btn:hover::before {
            transform: translateX(-4px);
        }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            .pdf-container iframe {
                height: 600px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="title-container" style="max-width: 1200px; margin: 0 auto;">
            <div class="titletxt-container" style="width: 100%; text-align: center;">
                <h1 class="page-title">Curriculum Vitae</h1>
                <p class="page-subtitle">Mi trayectoria académica y profesional en ingeniería informática</p>
            </div>
        </div>
    </header>

    <main>
        <!-- PDF VIEWER -->
        <div class="pdf-container">
            <iframe src="assets/CV Pablo Jurado.pdf" title="CV Pablo Jurado Soto"></iframe>
        </div>

        <!-- DOWNLOAD -->
        <div class="actions-container">
            <a href="assets/CV Pablo Jurado.pdf" class="download-btn" download>⬇ Descargar CV</a>
        </div>

        <!-- BACK BUTTON -->
        <div class="back-container">
            <a href="index.html" class="back-btn">Volver al inicio</a>
        </div>
    </main>
</body>
</html>
